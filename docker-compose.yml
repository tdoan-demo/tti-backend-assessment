services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tti-pro-api-app
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -lc "
        if [ ! -f .env ]; then cp .env.docker.example .env; fi &&
        if [ ! -f vendor/autoload.php ]; then COMPOSER_PROCESS_TIMEOUT=1200 composer install --prefer-dist --no-progress --no-interaction; fi &&
        if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  mysql:
    image: mysql:8.4
    container_name: tti-pro-api-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: tti_pro_api
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: